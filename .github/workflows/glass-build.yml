name: Build Elefin Glass

# Builds the Elefin Glass APK (Apple TV-inspired UI fork) and publishes it as a GitHub Release,
# so `./tv install bobehthegamer-dev/elefin` and the in-app updater can pick it up.

on:
  push:
    branches: [glass-ui]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glass-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install CMake and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;27.0.12077973" > /dev/null

      # The AV1 decoder (copied from AndroidX Media3) expects these sources next to its CMakeLists.txt,
      # exactly as Media3's decoder_av1 README describes. Pinned for reproducible builds.
      - name: Fetch AV1 decoder sources
        run: |
          cd decoder_av1/src/main/jni
          git clone --depth 1 --branch v0.9.0 https://github.com/google/cpu_features
          git clone --depth 1 --branch v0.19.0 https://chromium.googlesource.com/codecs/libgav1
          git clone --depth 1 --branch 20230802.1 https://github.com/abseil/abseil-cpp.git libgav1/third_party/abseil-cpp

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elefin-glass
          path: app/build/outputs/apk/release/elefin-glass.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          APK=app/build/outputs/apk/release/elefin-glass.apk
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Elefin Glass $VERSION" \
              --notes "Apple TV-inspired restyle of Elefin. Installs alongside stock Elefin (app id com.flex.elefin.glass)."
          fi
